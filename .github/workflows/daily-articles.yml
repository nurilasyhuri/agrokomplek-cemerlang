name: Daily SEO Articles Publisher

on:
  schedule:
    # Runs everyday at 01:00 UTC (08:00 WIB pagi)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate daily SEO article
        run: node scripts/generate-daily-articles.mjs --count 1

      - name: Validate Astro build
        run: bun run build

      - name: Commit and push new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/artikel/
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "content(seo): publish daily SEO article"
            git push
          fi
